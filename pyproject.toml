[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facturafast"
version = "0.1.0"
description = "Base project for the PyWa items MVP."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["facturafast*"]

